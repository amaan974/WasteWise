<!doctype html><html><head><meta charset="utf-8"><title>Art preview</title>
<style>body{margin:0;background:#cfe9c4;font-family:sans-serif}canvas{display:block}</style></head>
<body><canvas id="c" width="1400" height="900"></canvas>
<script src="../js/core/util.js"></script>
<script src="../js/core/save.js"></script>
<script src="../js/art/draw.js"></script>
<script src="../js/art/characters.js"></script>
<script>
const cv=document.getElementById('c'),ctx=cv.getContext('2d');
const dirs=['down','right','up','left'];
const poses=['idle','wave','point','think','celebrate','carry'];
const emos=['happy','excited','worried','surprised','thinking','sad'];
const Q=new URLSearchParams(location.search);const BIG=Q.get('big');
function frame(ts){const t=Q.get('freeze')?1.3:ts/1000;if(Q.get('portraits')){ctx.clearRect(0,0,1400,900);['milo','maple','sunny','sprout','kid'].forEach((w,i)=>{ctx.save();ctx.translate(10+(i%3)*250,10+Math.floor(i/3)*250);WW.chars.portrait(ctx,w,240,240,{t,talking:true,emotion:'happy'});ctx.restore();});requestAnimationFrame(frame);return;}if(BIG){ctx.clearRect(0,0,1400,900);ctx.fillStyle='#9ad37a';ctx.fillRect(0,0,1400,900);dirs.forEach((d,i)=>WW.chars.draw(ctx,BIG,{x:110+i*190,y:260,dir:d,t,anim:Q.get('walk')?t*9:0,moving:!!Q.get('walk'),scale:4.2}));poses.forEach((p,i)=>WW.chars.draw(ctx,BIG,{x:70+i*130,y:560,dir:'down',t,pose:p,emotion:emos[i],scale:3}));requestAnimationFrame(frame);return;}ctx.clearRect(0,0,1400,900);ctx.fillStyle='#9ad37a';ctx.fillRect(0,0,1400,900);
 const who=['milo','kid','maple','sunny','sprout'];
 who.forEach((w,r)=>{dirs.forEach((d,i)=>{WW.chars.draw(ctx,w,{x:70+i*95,y:120+r*160,dir:d,t,anim:t*9,moving:true,scale:1.6});});
  poses.forEach((p,i)=>{WW.chars.draw(ctx,w,{x:470+i*95,y:120+r*160,dir:'down',t,pose:p,emotion:emos[i],talking:i==0,scale:1.6});});
 });
 ['milo','maple','sunny','sprout','kid'].forEach((w,i)=>{ctx.save();ctx.translate(1060,10+i*175);WW.chars.portrait(ctx,w,150,150,{t,talking:true,emotion:'happy'});ctx.restore();});
 requestAnimationFrame(frame);}
requestAnimationFrame(frame);
</script></body></html>
